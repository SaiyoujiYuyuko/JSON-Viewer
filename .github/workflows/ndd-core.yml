name: Notepad-- shared core
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  core-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Initialize parser and tests
        run: git submodule update --init external/rapidjson external/googletest
      - name: Configure host-independent tests
        run: cmake -S . -B .build/core -A x64 -DBUILD_NDD_PLUGIN=OFF
      - name: Build
        run: cmake --build .build/core --config Release --parallel
      - name: Test
        run: ctest --test-dir .build/core -C Release --output-on-failure
